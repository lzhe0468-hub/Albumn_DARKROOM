<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" rx="40" fill="#1a1208"/>
  <!-- film strip body -->
  <rect x="32" y="72" width="192" height="112" rx="8" fill="#2a1f10"/>
  <!-- top sprocket holes -->
  <rect x="48" y="60" width="20" height="16" rx="4" fill="#0a0805"/>
  <rect x="80" y="60" width="20" height="16" rx="4" fill="#0a0805"/>
  <rect x="112" y="60" width="20" height="16" rx="4" fill="#0a0805"/>
  <rect x="144" y="60" width="20" height="16" rx="4" fill="#0a0805"/>
  <rect x="176" y="60" width="20" height="16" rx="4" fill="#0a0805"/>
  <!-- bottom sprocket holes -->
  <rect x="48" y="180" width="20" height="16" rx="4" fill="#0a0805"/>
  <rect x="80" y="180" width="20" height="16" rx="4" fill="#0a0805"/>
  <rect x="112" y="180" width="20" height="16" rx="4" fill="#0a0805"/>
  <rect x="144" y="180" width="20" height="16" rx="4" fill="#0a0805"/>
  <rect x="176" y="180" width="20" height="16" rx="4" fill="#0a0805"/>
  <!-- film frames -->
  <rect x="44" y="88" width="44" height="80" rx="3" fill="#c8a96e" opacity="0.15"/>
  <rect x="96" y="88" width="64" height="80" rx="3" fill="#c8a96e" opacity="0.35"/>
  <rect x="168" y="88" width="44" height="80" rx="3" fill="#c8a96e" opacity="0.15"/>
  <!-- center frame highlight -->
  <rect x="100" y="92" width="56" height="72" rx="2" fill="#c8a96e" opacity="0.12"/>
  <!-- aperture circle in center -->
  <circle cx="128" cy="128" r="22" fill="none" stroke="#c8a96e" stroke-width="3" opacity="0.8"/>
  <circle cx="128" cy="128" r="12" fill="#c8a96e" opacity="0.6"/>
  <!-- D A R K R O O M text hint (abstract lines) -->
  <text x="128" y="232" font-family="serif" font-size="18" fill="#c8a96e" opacity="0.7" text-anchor="middle" letter-spacing="6">DARKROOM</text>
</svg>
